apiVersion: apps/v1
kind: Deployment

metadata:
  name: My-nginx-deployment
  labels:
    app: nginx

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
      - name: my-nginx-container
        image: nginx:latest

        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
 name: my-Service
 labels:
  app: nginx
spec:
 labels: 
  app: nginx
ports:
  - protocol: TCP
    port: 80
    targetPort: 80
type: ClusterIP
